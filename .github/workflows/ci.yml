name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Test the DSH bundle host half
        run: npm run plugins:test

      - name: Smoke test the packed tarball
        run: npm run smoke

  npx:
    name: npx one-liner (download and run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build

      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          npm pack --pack-destination "$RUNNER_TEMP/pkg"
          echo "TGZ=$(ls "$RUNNER_TEMP"/pkg/*.tgz)" >> "$GITHUB_ENV"

      - name: Run the packed CLI from a clean directory (no clone, no install)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # `npx <tarball>` only works on npm 11+; the --package form works on every npm.
          time npx --yes --package "$TGZ" -- dsh-plugin-guard scan "${{ github.workspace }}/tests/fixtures/clean-plugin" | tee scan.txt
          grep -q "PASS" scan.txt
          test "${PIPESTATUS[0]}" -eq 0

      - name: A high-risk plugin must exit 1
        working-directory: ${{ runner.temp }}
        run: |
          set +e
          npx --yes --package "$TGZ" -- dsh-plugin-guard scan "${{ github.workspace }}/tests/fixtures/postinstall" > risky.txt 2>&1
          code=$?
          cat risky.txt
          test "$code" -eq 1
          grep -q "FAIL" risky.txt

      - name: doctor runs without a hard failure
        working-directory: ${{ runner.temp }}
        run: |
          set +e
          npx --yes --package "$TGZ" -- dsh-plugin-guard doctor
          test $? -eq 0